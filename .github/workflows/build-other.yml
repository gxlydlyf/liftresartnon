name: Build and deploy other web version

on:
  push:
    branches:
      - main
    paths:
      - "lifeRestart_other/**"
      - ".github/workflows/build-other.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lifeRestart_other

    env:
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lifeRestart_other/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web files
        run: npm run build

      - name: Prepare GitHub Pages root files
        working-directory: .
        run: |
          rm -rf site
          mkdir -p site

          # keep the app under /view
          cp -a lifeRestart_other/view site/

          # put shared static assets at site root so ../lib and ../public resolve correctly
          cp -a lifeRestart_other/lib site/
          cp -a lifeRestart_other/public site/
          cp -a lifeRestart_other/data site/

          # root redirect to the actual game page
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8" />
            <meta http-equiv="refresh" content="0; url=./view/index.html" />
            <title>Redirecting...</title>
          </head>
          <body>
            Redirecting to <a href="./view/index.html">game page</a>...
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
