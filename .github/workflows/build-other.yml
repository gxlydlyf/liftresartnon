name: Build other web version

on:
  push:
    branches:
      - main
    paths:
      - "lifeRestart_other/**"
      - ".github/workflows/build-other.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-other
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lifeRestart_other

    env:
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lifeRestart_other/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build other web version
        run: npm run build

      - name: Upload built web files as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifeRestart_other-web
          path: lifeRestart_other/public
          if-no-files-found: error
          retention-days: 30
