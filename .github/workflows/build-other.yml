name: Build other web version

on:
  push:
    branches:
      - main
    paths:
      - "lifeRestart_other/**"
      - ".github/workflows/build-other.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-other
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lifeRestart_other

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lifeRestart_other/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build other web version
        run: npm run build

      - name: Commit generated web files
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lifeRestart_other/public
          if git diff --cached --quiet; then
            echo "No generated files changed."
            exit 0
          fi
          git commit -m "build: generate other web version"
          git push
